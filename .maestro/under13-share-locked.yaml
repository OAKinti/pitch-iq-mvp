# Under-13 profile: the share screen is locked. Uses the simulated drill (no live camera).
appId: com.pitchiq.mvp
name: PitchIQ under-13 share locked
---
- launchApp:
    clearState: true
- assertVisible:
    id: screen-onboarding
- tapOn:
    id: age-year-input
- inputText: "2018"
- tapOn:
    id: age-month-input
- inputText: "6"
- hideKeyboard
- tapOn:
    id: age-continue
- assertVisible:
    id: private-account-notice
- tapOn:
    id: consent-checkbox
- tapOn:
    id: consent-accept
- tapOn:
    id: persona-option-captain
- tapOn:
    id: position-option-MID
- tapOn:
    id: onboarding-finish
- assertVisible:
    id: screen-combine
- tapOn:
    id: drill-option-ball_mastery
- tapOn:
    id: simulate-toggle
- tapOn:
    id: drill-start
- extendedWaitUntil:
    visible:
      id: drill-view-results
    timeout: 45000
- tapOn:
    id: drill-view-results
- tapOn:
    id: ovr-share
- assertVisible:
    id: screen-highlight
- assertVisible:
    id: share-age-locked
